<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Petitions</title>
    <link rel="stylesheet" href="browse-styles.css">
   
    <script src="firebaseConfig.js" type="module" defer></script>
    <script src="auth.js" type="module" defer></script>
    <script src="browse.js" type="module" defer></script>
</head>
<body>
     
     <div id="user-info">
        <div id="user-details">
            <img src="https://img.icons8.com/ios-filled/50/000000/user-male-circle.png" alt="User Icon">
            <span id="user-email">Loading...</span>
        </div>
        <button onclick="logout()" id="logout-btn">Logout</button>
    </div>
    <header class="hero">
        <div class="overlay">
            <h1>Browse Petitions</h1>
            <p>Raise your voice for mental health awareness and gender equality</p>
        </div>
    </header>

    <main id="petitions-container" class="petitions-container">
        
    </main>

    <div id="popup" class="popup">
        <div class="popup-content">
            <span class="close-btn">&times;</span>
            <img id="popup-image" src="" alt="Petition Image">
            <h2 id="popup-title"></h2>
            <p id="popup-description"></p>
            <div class="petition-info">
                <span id="popup-author"></span> |
                <span id="popup-supporters"></span> |
                <span id="popup-date"></span>
            </div>
            <a id="sign-petition-btn" href="sign-petition.html" class="sign-button">Sign Petition</a>
        </div>
    </div>

    <style>
        .popup { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .popup-content { background: white; padding: 20px; border-radius: 10px; text-align: center; width: 90%; max-width: 500px; }
        .close-btn { position: relative; top: 8px; left: 240px; cursor: pointer; font-size: 20px; }
        .sign-button { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #ff4081; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; transition: background 0.3s ease-in-out; }
        .sign-button:hover { background: #e91e63; }
    </style>
</body>
</html>
