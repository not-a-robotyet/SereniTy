<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Petition</title>

</head>
<body>
    <div class="form-container">
        <h1>Sign the Petition: <span id="petition-title">Loading...</span></h1>
        <p id="supporters-count">Supporters: Loading...</p>
        
        <form id="petition-form">
            <input type="hidden" id="petition-id">
            <input type="text" id="first-name" placeholder="First Name" required>
            <input type="text" id="last-name" placeholder="Last Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="text" id="address" placeholder="Address" required>
            <button type="submit">Sign Petition</button>
        </form>
    </div>
    <div id="info-overlay"></div>
    <div class="info">
        <p id="infoholder"></p>
        <button type="submit" id="ok">okay!</button>
    </div>
    <script src="firebaseConfig.js" type="module" defer></script>
    <script src="start.js" type="module" defer></script>
    <script src="auth.js" type="module" defer></script>
    <script src="sign.js" type="module" defer></script>
    <script src="browse.js" type="module" defer></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: url('signp1.jpg') no-repeat center center fixed, linear-gradient(135deg, #ff758c, #ff7eb3);
            background-size: cover;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .form-container {
            background: rgba(0, 0, 0, 0.6); /* Black background with 60% transparency */
            color: white; /* Text color inside the box */
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 400px;
            z-index: 10;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            color: #ddd;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input {
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        button {
            padding: 12px;
            background: #ff4081;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e91e63;
        }

        
        .info {
            display: none;
            padding: 20px;
            margin: 10px 0px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 400px;
            z-index: 1000;
            position: absolute;
            top: 40px;
        }
        #info-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            z-index: 999;
        }

        #infoholder {
            color: #333;
        }
    </style>
</body>
</html>
